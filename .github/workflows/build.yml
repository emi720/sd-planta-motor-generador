# Tests, firmware y ejecutables para Linux, Windows y macOS.
# En cada push a main: tests + ejecutables como artefactos del workflow.
# Con un tag vX.Y.Z: además publica un Release con los tres paquetes.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d firmware
      - name: El .hex empaquetado coincide con el que compila el firmware
        run: |
          ver=$(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' firmware/src/config.h)
          cmp firmware/.pio/build/uno/firmware.hex "host/src/planta/firmware/planta-fw-$ver.hex" \
            || { echo "::error::Actualizar host/src/planta/firmware/planta-fw-$ver.hex"; exit 1; }

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # glibc 2.35: corre en distros más viejas
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest      # Apple Silicon
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: host
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev,build]"
      - run: pytest -q
      - run: pyinstaller --noconfirm packaging/planta.spec

      - name: Autotest del ejecutable (Linux)
        if: runner.os == 'Linux'
        run: dist/Planta/Planta --selftest
      - name: Autotest del ejecutable (macOS)
        if: runner.os == 'macOS'
        run: dist/Planta.app/Contents/MacOS/Planta --selftest
      - name: Autotest del ejecutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Planta\Planta.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest falló ($($p.ExitCode))" }

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/Planta-${{ matrix.name }}
          cp -r dist/Planta/* out/Planta-${{ matrix.name }}/
          cp packaging/linux/instalar.sh packaging/icon.png out/Planta-${{ matrix.name }}/
          tar -C out -czf Planta-${{ matrix.name }}.tar.gz Planta-${{ matrix.name }}
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Planta -DestinationPath Planta-${{ matrix.name }}.zip
      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg && cp -R dist/Planta.app dmg/ && ln -s /Applications dmg/Applications
          # hdiutil a veces falla en CI con "Resource busy": reintentar
          for i in 1 2 3 4 5; do
            hdiutil create -volname Planta -srcfolder dmg -ov -format UDZO Planta-${{ matrix.name }}.dmg && break
            sleep 5
          done
          test -f Planta-${{ matrix.name }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Planta-${{ matrix.name }}
          path: host/Planta-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*
          generate_release_notes: true
