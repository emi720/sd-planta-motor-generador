[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planta"
version = "0.1.0"
description = "Adquisición para la planta motor-generador DC (Sistemas Dinámicos, ORT)"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
planta = "planta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planta = ["firmware/*.hex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
