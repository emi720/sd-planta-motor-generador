; Firmware de adquisición para la planta motor-generador (Arduino UNO).
; Compilar: pio run        Subir: pio run -t upload        Monitor: pio device monitor

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_flags = -Wall -Wextra
; 250000 baud: divisor exacto a 16 MHz (error 0 %) y margen de sobra a 1 kHz
monitor_speed = 250000
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter
